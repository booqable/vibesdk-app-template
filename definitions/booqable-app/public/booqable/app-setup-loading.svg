<svg
  xmlns="http://www.w3.org/2000/svg"
  width="280"
  height="160"
  viewBox="0 0 280 160"
  fill="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Setting up custom app</title>
  <desc id="description">A minimal animated app window assembling itself while setup is in progress.</desc>

  <style>
    .active-outline {
      animation: travel 2.8s linear infinite;
    }

    .sidebar {
      transform-origin: 101px 84px;
      animation: sidebar-build 4.8s cubic-bezier(.22,.78,.24,1) infinite;
    }

    .heading {
      transform-origin: 154px 67px;
      animation: heading-build 4.8s cubic-bezier(.22,.78,.24,1) infinite;
    }

    .card-left {
      transform-origin: 137px 91px;
      animation: card-left-build 4.8s cubic-bezier(.22,.78,.24,1) infinite;
    }

    .card-right {
      transform-origin: 169px 91px;
      animation: card-right-build 4.8s cubic-bezier(.22,.78,.24,1) infinite;
    }

    .status-dot {
      transform-origin: 169px 91px;
      animation: status-pulse 1.4s ease-in-out infinite;
    }

    @keyframes travel {
      to { stroke-dashoffset: -439; }
    }

    @keyframes sidebar-build {
      0%, 6%, 100% { opacity: .32; transform: translate(-8px, 0); }
      20%, 78%      { opacity: 1; transform: translate(0, 0); }
      92%           { opacity: .48; transform: translate(-2px, 0); }
    }

    @keyframes heading-build {
      0%, 12%, 100% { opacity: .28; transform: translate(0, -7px); }
      27%, 78%       { opacity: 1; transform: translate(0, 0); }
      92%            { opacity: .48; transform: translate(0, -2px); }
    }

    @keyframes card-left-build {
      0%, 19%, 100% { opacity: .28; transform: translate(0, 8px); }
      35%, 78%       { opacity: 1; transform: translate(0, 0); }
      92%            { opacity: .48; transform: translate(0, 2px); }
    }

    @keyframes card-right-build {
      0%, 27%, 100% { opacity: .24; transform: translate(8px, 0); }
      43%, 78%       { opacity: 1; transform: translate(0, 0); }
      92%            { opacity: .48; transform: translate(2px, 0); }
    }

    @keyframes status-pulse {
      0%, 100% { opacity: .55; transform: scale(.76); }
      50%      { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .active-outline,
      .sidebar,
      .heading,
      .card-left,
      .card-right,
      .status-dot {
        animation: none;
      }
    }
  </style>

  <!-- App frame -->
  <rect x="76" y="27" width="128" height="106" rx="17" fill="#FBFCFE" stroke="#DDE4EC" stroke-width="2"/>
  <path d="M77 51H203" stroke="#E5EAF0" stroke-width="2"/>

  <!-- Window controls -->
  <circle cx="91" cy="39" r="3" fill="#CFD7E1"/>
  <circle cx="101" cy="39" r="3" fill="#CFD7E1"/>
  <circle cx="111" cy="39" r="3" fill="#CFD7E1"/>

  <!-- UI modules assembling -->
  <g class="sidebar">
    <rect x="88" y="62" width="26" height="44" rx="7" fill="#E7F0FD"/>
    <rect x="94" y="70" width="14" height="4" rx="2" fill="#AFCBF6"/>
    <rect x="94" y="80" width="10" height="4" rx="2" fill="#C7D9F4"/>
    <rect x="94" y="90" width="12" height="4" rx="2" fill="#C7D9F4"/>
  </g>

  <g class="heading">
    <rect x="122" y="62" width="64" height="11" rx="5.5" fill="#C7D9F4"/>
  </g>

  <g class="card-left">
    <rect x="122" y="81" width="30" height="25" rx="7" fill="#E7F0FD"/>
    <rect x="128" y="88" width="18" height="4" rx="2" fill="#BBD1F3"/>
    <rect x="128" y="96" width="11" height="4" rx="2" fill="#D0DEF3"/>
  </g>

  <g class="card-right">
    <rect x="158" y="81" width="28" height="25" rx="7" fill="#136DEB"/>
    <circle class="status-dot" cx="172" cy="93.5" r="4" fill="#FFFFFF"/>
  </g>

  <!-- A single moving segment keeps the loader visibly active during long setup -->
  <rect
    class="active-outline"
    x="76"
    y="27"
    width="128"
    height="106"
    rx="17"
    stroke="#136DEB"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-dasharray="62 377"
  />
</svg>
