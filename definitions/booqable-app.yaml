name: "booqable-app"
description: "Booqable custom app starter: shadcn/ui themed to Booqable (Boomerang) with iframe session, OAuth, and API proxy wiring"
base_reference: "vite-reference"
projectType: app

# The reference already ships the full shadcn/ui set; this overlay keeps it and
# re-themes it to Booqable via tokens (tailwind.config.js + src/index.css, light
# mode only). So the excludes here only drop the reference demo/chrome and the
# sidebar (which needs the excluded use-mobile hook and has no place in an
# embedded app). The error-reporting infra
# (ErrorBoundary/ErrorFallback/RouteErrorBoundary/errorReporter) is kept.
excludes:
  - "src/App.css"
  - "src/assets/**"
  - "src/hooks/**"
  - "src/components/app-sidebar.tsx"
  - "src/components/TemplateDemo.tsx"
  - "src/components/ThemeToggle.tsx"
  - "src/components/layout/**"
  # Needs the excluded use-mobile hook; an embedded Booqable app has no sidebar.
  - "src/components/ui/sidebar.tsx"

package_patches:
  name: "booqable-app"
  dependencies:
    "@fontsource/mulish": "^5.2.5"
